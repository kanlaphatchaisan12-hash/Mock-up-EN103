/* Matching uses a paper background and reserves stronger colors for feedback. */
.match-study{max-width:1020px}
.match-study .page-title p{font-size:1.0625rem;max-width:43rem}
.match-card{padding:clamp(16px,3.3vw,32px);border-radius:14px}
.match-count{font-weight:710;color:var(--deep);font-variant-numeric:tabular-nums}
.match-grid{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);align-items:start;gap:clamp(16px,4vw,42px)}
.match-column{display:grid;gap:9px;align-content:start;min-width:0}
.match-column h2{font-size:1rem;font-weight:720;padding:0 0 7px;border-bottom:1px solid var(--line);margin-bottom:3px}
.match-tile{position:relative;display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;min-height:55px;padding:11px 14px;text-align:left;line-height:1.5;overflow-wrap:anywhere;border-radius:8px;font-size:1.0625rem;user-select:none;-webkit-user-select:none}
.match-words .match-tile{font-weight:700}
.match-words .match-tile:not(:disabled){cursor:grab;touch-action:none}
.match-words .match-tile:active:not(:disabled){cursor:grabbing}
.match-options .match-tile{font-weight:490}
.match-options .match-tile.drop-ready{background:#e4efe7;border-color:#548369;outline:2px dashed #548369;outline-offset:-4px}
.match-tile.drag-source{opacity:.43}
.match-options .match-tile.matched{flex-direction:column;align-items:flex-start}
.match-words .match-tile.matched{background:#f3f5ef;border-style:dashed;color:var(--muted);font-size:.9rem}
.placed-word{display:inline-block;background:#d3e7d8;border-radius:5px;padding:3px 7px;font-weight:730;color:#224d38}
.drag-card-preview{position:fixed;z-index:10;left:0;top:0;max-width:calc(100vw - 16px);padding:11px 14px;border:1px solid #548369;border-radius:8px;background:#edf6e9;color:#224d38;box-shadow:0 6px 18px #25332d33;font-weight:720;line-height:1.5;overflow-wrap:anywhere;pointer-events:none}
.match-tile span:first-child{min-width:0}
.match-tile[aria-pressed="true"]{background:#e4efe7;border-color:#548369;color:#224d38;box-shadow:inset 3px 0 #548369}
.match-tile.matched{opacity:1;color:#255a41;background:#e8f3e8;border-color:#b8ceb9}
.match-tile.incorrect{color:#893f39;background:#faece8;border-color:#cb9489}
.match-tile.skipped{opacity:1;color:var(--muted);background:#f1f3ed;border-style:dashed}
.match-word-row{display:grid;grid-template-columns:44px minmax(0,1fr);gap:7px}
.match-word-row .match-tile{grid-column:2;grid-row:1}
.star-word{grid-column:1;grid-row:1;align-self:center;padding:0;width:44px;min-height:44px;color:#655331;font:1.45rem/1 system-ui}
.star-word[aria-pressed="true"]{background:#f9edcc;border-color:#d5b977;color:#795416}
.match-card .match-feedback{margin:0 0 16px;padding:8px 13px;border-left:3px solid #a1ae9e;background:#f3f5ef;font-weight:650;border-radius:0 6px 6px 0}
.match-card .match-feedback.good{border-color:#548369;color:#255a41;background:#e8f3e8}
.match-card .match-feedback.wrong{border-color:#b76d60;color:#893f39;background:#faece8}
.match-actions{margin-top:21px;padding-top:15px;border-top:1px solid var(--line)}
.match-enter{animation:match-in 180ms ease-out both}
@keyframes match-in{from{opacity:.72;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){.match-enter{animation:none}}
@media(max-width:640px){
  .match-card{padding-inline:12px}
  .match-grid{grid-template-columns:minmax(0,.76fr) minmax(0,1.24fr);gap:12px}
  .match-column h2{min-height:3.05em;display:flex;align-items:end;line-height:1.35}
  .match-tile{padding:8px 9px;font-size:1rem}
  .match-word-row{grid-template-columns:minmax(0,1fr);gap:2px}
  .match-word-row .match-tile{grid-column:1}
  .star-word{grid-row:2;background:transparent;border-color:transparent}
  .match-actions .button{max-width:100%}
}
@media(max-width:460px){.nav{width:100%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}.nav button{text-align:left;min-height:40px}.poster-stats{flex-wrap:wrap}}

?", "ถามเรื่องในอนาคต", "What will you do next?", "ต่อไปคุณจะทำอะไร"], ["Who + กริยา?", "ถ้า Who เป็นประธานในคำถาม simple past ให้ตามด้วยกริยาช่อง 2 ได้เลย", "Who called the reporter?", "ใครโทรหาผู้สื่อข่าว"]]], [1, "Present perfect และ Future with will", [["S + has/have + V3", "ใช้กับประสบการณ์ ผลที่เกี่ยวกับปัจจุบัน หรือสิ่งที่ต่อเนื่องถึงตอนนี้ สังเกต just, already, yet, ever, since และ for ตามบริบท", "A new café has just opened.", "คาเฟ่ใหม่เพิ่งเปิด"], ["S + V2", "ใช้กับเวลาที่จบไปแล้ว เช่น yesterday หรือ last week", "The café opened yesterday.", "คาเฟ่เปิดเมื่อวาน"], ["S + will + V1", "ใช้พูดถึงอนาคต เช่น การคาดการณ์หรือการตัดสินใจ", "The station will open next month.", "สถานีจะเปิดเดือนหน้า"], ["S + am/is/are หรือ was/were + V-ing", "ใช้เล่าเหตุการณ์ที่กำลังดำเนินอยู่ในเวลาปัจจุบันหรืออดีต", "The reporter was filming when the rain started.", "ผู้สื่อข่าวกำลังถ่ายทำตอนฝนเริ่มตก"]]], [2, "Verb + object + verb", [["let / make / have + O + V1", "ในโครงสร้างนี้ใช้กริยาช่อง 1 หลังกรรมโดยตรง", "Let me explain.", "ให้ฉันอธิบายเถอะ"], ["ask / tell / invite / remind + O + to + V1", "จำเป็นกลุ่มว่าคำเหล่านี้ตามด้วย กรรม + to + กริยาช่อง 1", "She reminded me to call.", "เธอเตือนให้ฉันโทร"], ["help + O + (to) + V1", "ใช้ได้ทั้งมี to และละ to", "Can you help me (to) find it?", "ช่วยฉันหาหน่อยได้ไหม"]]], [2, "Present perfect continuous", [["S + has/have been + V-ing", "เน้นกิจกรรมที่เริ่มในอดีตและยังทำอยู่ หรือเพิ่งหยุดแล้วมีผลให้เห็นตอนนี้", "I have been studying for two hours.", "ฉันอ่านหนังสือมาแล้วสองชั่วโมง"], ["since + จุดเริ่มต้น / for + ระยะเวลา", "ใช้ since กับจุดเริ่ม เช่น Monday ใช้ for กับช่วงเวลา เช่น a week", "She has been practicing since Monday.", "เธอฝึกมาตั้งแต่วันจันทร์"]]], [3, "Present passive", [["S + am/is/are + V3", "เอาสิ่งที่ได้รับการกระทำขึ้นหน้า ใช้ is กับเอกพจน์หรือคำนามนับไม่ได้ และ are กับพหูพจน์", "The sauce is served warm.", "ซอสเสิร์ฟตอนอุ่น"], ["S + am/is/are + not + V3", "เติม not หลัง verb to be เมื่อต้องการบอกปฏิเสธ", "The dumplings aren’t fried.", "เกี๊ยวไม่ได้ทอด"]]], [3, "Time clauses", [["before / after", "before = ก่อนที่ อีกเหตุการณ์เกิดหลังเหตุการณ์หลัก · after = หลังจากที่ อีกเหตุการณ์เกิดก่อนเหตุการณ์หลัก", "Before you add salt, taste the soup.", "ชิมซุปก่อนเติมเกลือ"], ["until", "ทำสิ่งหนึ่งต่อไปจนถึงจุดที่ระบุ", "Stir the sauce until it thickens.", "คนซอสจนข้น"], ["once / as soon as", "once = เมื่อ…แล้ว · as soon as = ทันทีที่ ถ้าส่วนบอกเวลาขึ้นต้นประโยค ให้ใส่ comma คั่น", "As soon as the water boils, add the noodles.", "ทันทีที่น้ำเดือด ให้ใส่เส้น"]]], [4, "Second conditional", [["If + S + V2, S + would + V1", "ใช้สมมติเรื่องในปัจจุบันหรืออนาคต ในโจทย์แนวนี้เมื่อใช้ be ในเงื่อนไขสมมติ ให้เลือก were ได้กับทุกประธาน", "If I were you, I would apologize.", "ถ้าฉันเป็นคุณ ฉันจะขอโทษ"], ["What would + S + V1? / S + wouldn’t + V1", "คำถามวาง would หน้าประธาน ส่วนปฏิเสธใช้ wouldn’t", "What would you do if someone cut in line?", "คุณจะทำอย่างไรถ้ามีคนแซงคิว"]]], [5, "Comparisons", [["adjective-er / more + adjective + than", "เปรียบเทียบสองสิ่ง คำสั้นมักเติม -er คำยาวมักใช้ more", "This street is more crowded than that one.", "ถนนนี้คนแน่นกว่าถนนเส้นนั้น"], ["as + adjective + as", "ใช้เมื่อสองสิ่งมีระดับเท่ากัน", "This hotel is as quiet as the other one.", "โรงแรมนี้เงียบพอ ๆ กับอีกแห่ง"], ["the adjective-est / the most + adjective", "ใช้กับสิ่งที่มีระดับสูงสุดในกลุ่ม good เปลี่ยนเป็น better / best", "It is the busiest station in town.", "สถานีนี้พลุกพล่านที่สุดในเมือง"]]], [5, "Reported advice", [["advised + O + to + V1", "ใช้เล่าว่าใครแนะนำให้ใครทำอะไร", "The guide advised us to book early.", "ไกด์แนะนำให้เราจองล่วงหน้า"], ["advised + O + not to + V1", "ถ้าแนะนำว่าอย่าทำ ให้วาง not หน้า to", "She advised me not to travel at night.", "เธอแนะนำฉันว่าอย่าเดินทางตอนกลางคืน"]]]], "questions": [{"id": 1, "unit": 1, "section": "Listening", "topic": "City news", "prompt": "When did the station reopen?", "correct": "On Friday", "distractors": ["On Monday", "On Thursday", "On Sunday"], "explanation": "ผู้พูดบอกว่า the old train station reopened on Friday.", "passageId": "listening-1"}, {"id": 2, "unit": 1, "section": "Listening", "topic": "City news", "prompt": "Who filmed the opening?", "correct": "A group of students", "distractors": ["Train drivers", "Local reporters", "The station manager"], "explanation": "A group of students filmed the opening คือกลุ่มนักเรียนถ่ายวิดีโองานเปิด", "passageId": "listening-1"}, {"id": 3, "unit": 2, "section": "Listening", "topic": "Study routine", "prompt": "How much time does the speaker set aside?", "correct": "Fifteen minutes", "distractors": ["Five minutes", "Thirty minutes", "Fifty minutes"], "explanation": "fifteen minutes = 15 นาที ส่วน fifty = 50 นาที", "passageId": "listening-2"}, {"id": 4, "unit": 2, "section": "Listening", "topic": "Study routine", "prompt": "What does the speaker now add to the cards?", "correct": "A short example", "distractors": ["A picture", "A pronunciation guide", "A note about the time"], "explanation": "ฟังส่วนหลัง but now ที่บอกว่า I also write a short example", "passageId": "listening-2"}, {"id": 5, "unit": 3, "section": "Listening", "topic": "Cooking class", "prompt": "How are the dumplings cooked?", "correct": "They are steamed.", "distractors": ["They are baked.", "They are fried.", "They are grilled."], "explanation": "steam them คือให้นึ่ง สังเกตว่าตะกร้าอยู่เหนือน้ำเดือด", "passageId": "listening-3"}, {"id": 6, "unit": 3, "section": "Listening", "topic": "Cooking class", "prompt": "What is served with the dumplings?", "correct": "A spicy sauce", "distractors": ["A sweet sauce", "A creamy soup", "A bowl of rice"], "explanation": "ตอนท้ายระบุ serve them with a spicy sauce", "passageId": "listening-3"}, {"id": 7, "unit": 4, "section": "Listening", "topic": "On the bus", "prompt": "What did Maya do?", "correct": "She offered someone her seat.", "distractors": ["She cut in line.", "She talked loudly.", "She gave someone her ticket."], "explanation": "offered him her seat แปลว่าสละที่นั่งให้เขา", "passageId": "listening-4"}, {"id": 8, "unit": 4, "section": "Listening", "topic": "On the bus", "prompt": "How long had the man been standing?", "correct": "Nearly twenty minutes", "distractors": ["About two minutes", "More than an hour", "Nearly ten minutes"], "explanation": "nearly twenty minutes หมายถึงเกือบ 20 นาที", "passageId": "listening-4"}, {"id": 9, "unit": 5, "section": "Listening", "topic": "Hotel check-in", "prompt": "What happened to the guest’s room?", "correct": "It was upgraded.", "distractors": ["It was canceled.", "It was changed to a smaller room.", "It was moved to a different hotel."], "explanation": "upgraded to a larger one หมายถึงได้ห้องที่ใหญ่ขึ้น", "passageId": "listening-5"}, {"id": 10, "unit": 5, "section": "Listening", "topic": "Hotel check-in", "prompt": "Where can the guest get a discounted museum ticket?", "correct": "At the front desk", "distractors": ["At the train station", "In the breakfast room", "On the museum bus"], "explanation": "ผู้พูดบอกว่า here at the front desk หรือที่เคาน์เตอร์ต้อนรับ", "passageId": "listening-5"}, {"id": 11, "unit": 1, "section": "Grammar", "topic": "คำถาม 6 กาล", "prompt": "___ your sister read the news every morning?", "correct": "Does", "distractors": ["Do", "Is", "Has"], "explanation": "every morning บอกกิจวัตร ใช้ Does + your sister + read", "passageId": null}, {"id": 12, "unit": 1, "section": "Grammar", "topic": "คำถาม 6 กาล", "prompt": "What ___ when the reporter called?", "correct": "were you doing", "distractors": ["you were doing", "did you doing", "are you do"], "explanation": "กำลังทำอยู่ตอนสายเข้าในอดีต ใช้ were + you + doing", "passageId": null}, {"id": 13, "unit": 1, "section": "Grammar", "topic": "คำถาม 6 กาล", "prompt": "เลือกคำถาม simple past ที่ใช้ Who เป็นประธาน", "correct": "Who rescued the dog?", "distractors": ["Who did rescued the dog?", "Who the dog rescued?", "Who does rescue the dog yesterday?"], "explanation": "Who เป็นคนลงมือช่วย จึงวาง rescued (V2) หลัง Who ได้เลย", "passageId": null}, {"id": 14, "unit": 1, "section": "Grammar", "topic": "Present perfect", "prompt": "The newspaper ___ the interview online already. You can read it now.", "correct": "has posted", "distractors": ["will post", "is post", "have posted"], "explanation": "the newspaper เป็นเอกพจน์ ใช้ has + posted และผลยังเกี่ยวกับตอนนี้", "passageId": null}, {"id": 15, "unit": 1, "section": "Grammar", "topic": "Future with will", "prompt": "I think the station ___ next month.", "correct": "will open", "distractors": ["will opens", "has open", "will opened"], "explanation": "หลัง will ใช้ open (V1) และ next month บอกเวลาอนาคต", "passageId": null}, {"id": 16, "unit": 2, "section": "Grammar", "topic": "Verb + object + verb", "prompt": "Please have her ___ me tonight.", "correct": "call", "distractors": ["to call", "called", "calls"], "explanation": "have + กรรม + V1 จึงเป็น have her call", "passageId": null}, {"id": 17, "unit": 2, "section": "Grammar", "topic": "Verb + object + verb", "prompt": "She reminded me ___ my notebook.", "correct": "to bring", "distractors": ["bring", "brought", "brings"], "explanation": "remind + กรรม + to + V1 จึงใช้ to bring", "passageId": null}, {"id": 18, "unit": 2, "section": "Grammar", "topic": "Present perfect continuous", "prompt": "I ___ English since Monday, and I’m still practicing.", "correct": "have been studying", "distractors": ["has been studying", "have studying", "will studying"], "explanation": "I ใช้ have been + studying ส่วน since Monday บอกจุดเริ่มต้น", "passageId": null}, {"id": 19, "unit": 3, "section": "Grammar", "topic": "Present passive", "prompt": "At this bakery, the rolls ___ every morning.", "correct": "are baked", "distractors": ["is baked", "are bake", "baked by"], "explanation": "rolls เป็นพหูพจน์ ใช้ are + baked (V3)", "passageId": null}, {"id": 20, "unit": 3, "section": "Grammar", "topic": "Present passive", "prompt": "The sauce ___ cold here. It is always served warm.", "correct": "isn’t served", "distractors": ["aren’t served", "isn’t serve", "doesn’t served"], "explanation": "sauce เป็นคำนามนับไม่ได้ในประโยคนี้ รูปปฏิเสธคือ isn’t + served", "passageId": null}, {"id": 21, "unit": 3, "section": "Grammar", "topic": "Time clauses", "prompt": "Keep stirring the sauce ___ it thickens.", "correct": "until", "distractors": ["after", "once", "as soon as"], "explanation": "ให้คนต่อเนื่องจนถึงจุดที่ซอสข้น จึงใช้ until", "passageId": null}, {"id": 22, "unit": 3, "section": "Grammar", "topic": "Time clauses", "prompt": "ชิมซุปก่อนเติมเกลือ เลือกคำเชื่อมและเครื่องหมายให้ถูกต้อง", "correct": "Before you add salt, taste the soup.", "distractors": ["After you add salt, taste the soup.", "Before you add salt taste the soup.", "Once you add salt, taste the soup."], "explanation": "ใช้ before เพื่อให้ชิมก่อนเติมเกลือ และใส่ comma หลังส่วนบอกเวลาที่ขึ้นต้นประโยค", "passageId": null}, {"id": 23, "unit": 4, "section": "Grammar", "topic": "Second conditional", "prompt": "If I ___ you, I ___ an apology.", "correct": "were / would offer", "distractors": ["am / would offer", "were / would offered", "would be / offered"], "explanation": "If I were you ใช้สมมติว่าเป็นอีกคน ส่วนผลใช้ would + offer (V1)", "passageId": null}, {"id": 24, "unit": 5, "section": "Grammar", "topic": "Comparisons", "prompt": "The city center is ___ than the suburbs.", "correct": "more crowded", "distractors": ["most crowded", "as crowded", "crowdedest"], "explanation": "than เป็นตัวช่วยสังเกตขั้นกว่า และ crowded ใช้ more crowded", "passageId": null}, {"id": 25, "unit": 5, "section": "Grammar", "topic": "Reported advice", "prompt": "“Don’t take an unlicensed taxi,” the guide said. → The guide advised us ___ an unlicensed taxi.", "correct": "not to take", "distractors": ["to not taking", "don’t take", "not taking"], "explanation": "advised + กรรม + not to + V1 ใช้รายงานคำแนะนำว่าอย่าทำ", "passageId": null}, {"id": 26, "unit": 1, "section": "Vocabulary", "topic": "ข่าว", "prompt": "The short title at the top of a news story is a ___.", "correct": "headline", "distractors": ["witness", "forecast", "profile"], "explanation": "headline คือพาดหัวข่าว", "passageId": null}, {"id": 27, "unit": 1, "section": "Vocabulary", "topic": "ข่าว", "prompt": "A reporter talked to someone who saw the accident. That person was a ___.", "correct": "witness", "distractors": ["tourist guide", "native speaker", "news section"], "explanation": "a witness คือผู้เห็นเหตุการณ์", "passageId": null}, {"id": 28, "unit": 2, "section": "Vocabulary", "topic": "การเรียนภาษา", "prompt": "Which tip means จดสมุดคำศัพท์?", "correct": "keep a vocabulary notebook", "distractors": ["make flash cards", "watch online video clips", "talk to yourself out loud"], "explanation": "keep a vocabulary notebook คือจดหรือเก็บสมุดคำศัพท์ไว้ใช้ทบทวน", "passageId": null}, {"id": 29, "unit": 2, "section": "Vocabulary", "topic": "ข้อมูลออนไลน์", "prompt": "I ___ ten minutes each day to review new words.", "correct": "set aside", "distractors": ["stick to it", "cut in line", "drop litter"], "explanation": "set aside + ช่วงเวลา หมายถึงกันเวลาไว้", "passageId": null}, {"id": 30, "unit": 2, "section": "Vocabulary", "topic": "ข้อมูลออนไลน์", "prompt": "People you know but are not close friends with are ___.", "correct": "casual acquaintances", "distractors": ["native speakers", "primary sources", "local reporters"], "explanation": "casual acquaintances คือคนรู้จักที่ไม่ได้สนิทกัน", "passageId": null}, {"id": 31, "unit": 3, "section": "Vocabulary", "topic": "การปรุง", "prompt": "Cook the dumplings using the vapor from hot water. ___ them for eight minutes.", "correct": "Steam", "distractors": ["Fry", "Grill", "Boil"], "explanation": "steam คือใช้ไอน้ำนึ่ง ส่วน boil คือปรุงโดยต้มในน้ำเดือด", "passageId": null}, {"id": 32, "unit": 3, "section": "Vocabulary", "topic": "รสชาติ", "prompt": "This soup has very little flavor. It tastes ___.", "correct": "bland", "distractors": ["spicy", "sweet", "sour"], "explanation": "bland ใช้เมื่อรสจืดหรือไม่มีรสเด่น", "passageId": null}, {"id": 33, "unit": 3, "section": "Vocabulary", "topic": "เนื้อสัมผัส", "prompt": "The nuts make a crisp sound when you bite into them. They are ___.", "correct": "crunchy", "distractors": ["chewy", "creamy", "juicy"], "explanation": "crunchy คือกรอบแบบกัดหรือเคี้ยวแล้วมีเสียง", "passageId": null}, {"id": 34, "unit": 3, "section": "Vocabulary", "topic": "อาหารแห่งอนาคต", "prompt": "I eat breakfast ___ because I have no time to sit down.", "correct": "on the run", "distractors": ["out loud", "in public", "at my leisure"], "explanation": "on the run ในบริบทนี้คือระหว่างที่เร่งรีบ", "passageId": null}, {"id": 35, "unit": 4, "section": "Vocabulary", "topic": "มารยาท", "prompt": "He walked past everyone waiting and went straight to the front. What did he do?", "correct": "He cut in line.", "distractors": ["He admitted a mistake.", "He gave someone a compliment.", "He offered someone his seat."], "explanation": "cut in line คือแซงคิว ดูจากการเดินผ่านคนที่รอแล้วไปด้านหน้าเลย", "passageId": null}, {"id": 36, "unit": 4, "section": "Vocabulary", "topic": "มารยาท", "prompt": "“Your presentation was excellent!” What is the speaker giving?", "correct": "A compliment", "distractors": ["An apology", "A discount", "A guarantee"], "explanation": "compliment คือคำชม ประโยคนี้ชมการนำเสนอ", "passageId": null}, {"id": 37, "unit": 4, "section": "Vocabulary", "topic": "คำที่ใช้คู่กัน", "prompt": "Which phrase means กล่าวขอโทษ?", "correct": "offer an apology", "distractors": ["offer someone your seat", "give someone a gift", "keep someone waiting"], "explanation": "offer an apology เป็นวลีที่ใช้เมื่อต้องการกล่าวขอโทษ", "passageId": null}, {"id": 38, "unit": 5, "section": "Vocabulary", "topic": "ประสบการณ์เดินทาง", "prompt": "I paid less than the usual price for a ___ ticket.", "correct": "discounted", "distractors": ["primary", "issued", "guaranteed"], "explanation": "discounted หมายถึงลดราคา สังเกตคำใบ้ว่า less than the usual price", "passageId": null}, {"id": 39, "unit": 5, "section": "Vocabulary", "topic": "ประสบการณ์เดินทาง", "prompt": "The embassy approved my application. My visa was ___ the next day.", "correct": "issued", "distractors": ["upgraded", "discounted", "roasted"], "explanation": "issued ใช้เมื่อหน่วยงานออกเอกสาร เช่น วีซ่า", "passageId": null}, {"id": 40, "unit": 5, "section": "Vocabulary", "topic": "ประสบการณ์เดินทาง", "prompt": "The hotel promised that a room would definitely be available. A room was ___.", "correct": "guaranteed", "distractors": ["discounted", "upgraded", "issued"], "explanation": "guaranteed หมายถึงรับประกันว่าจะมีห้องให้", "passageId": null}, {"id": 41, "unit": 1, "section": "Reading", "topic": "Citizen journalism", "prompt": "Who recorded the video?", "correct": "A resident", "distractors": ["An editor", "A police officer", "A news presenter"], "explanation": "ประโยคแรกบอกว่า a resident filmed the fallen tree", "passageId": "reading-1"}, {"id": 42, "unit": 1, "section": "Reading", "topic": "Citizen journalism", "prompt": "What did the editor do before publishing the video?", "correct": "Checked when and where it was filmed", "distractors": ["Reopened the road", "Filmed a second storm", "Interviewed a news presenter"], "explanation": "ประโยคที่สองระบุว่า editor ตรวจสอบเวลาและสถานที่ถ่ายทำ", "passageId": "reading-1"}, {"id": 43, "unit": 2, "section": "Reading", "topic": "Too much information", "prompt": "When does Nina check her messages?", "correct": "In the evening", "distractors": ["Before breakfast", "At noon", "Every hour"], "explanation": "in the evening บอกว่าช่วงเย็น", "passageId": "reading-2"}, {"id": 44, "unit": 2, "section": "Reading", "topic": "Too much information", "prompt": "In this passage, what does “primary” mean?", "correct": "Main", "distractors": ["Hidden", "Newest", "Optional"], "explanation": "primary หมายถึงหลัก และ checks it first ช่วยบอกว่าเธอให้ความสำคัญเป็นอันดับแรก", "passageId": "reading-2"}, {"id": 45, "unit": 3, "section": "Reading", "topic": "Future food", "prompt": "Which burger is the vegetarian option in the passage?", "correct": "The vegetable burger", "distractors": ["The lab-grown beef burger", "Both burgers", "Neither burger"], "explanation": "บทอ่านระบุว่าตัวเลือกหนึ่งทำจากผัก ส่วนอีกตัวเลือกคือเนื้อวัวเพาะเลี้ยง", "passageId": "reading-3"}, {"id": 46, "unit": 3, "section": "Reading", "topic": "Future food", "prompt": "What does “one” refer to?", "correct": "A beehive", "distractors": ["A rooftop garden", "A cracker", "A burger"], "explanation": "ต้องย้อนดูสิ่งที่ไกด์ชี้ คือ beehives คำว่า one จึงแทน a beehive", "passageId": "reading-3"}, {"id": 47, "unit": 4, "section": "Reading", "topic": "Make someone happy", "prompt": "What did Arun do when he noticed she was nervous?", "correct": "He gave her a compliment.", "distractors": ["He offered her a gift.", "He kept her waiting.", "He admitted a mistake."], "explanation": "he said he liked her idea เป็นการชมความคิดของเธอ", "passageId": "reading-4"}, {"id": 48, "unit": 4, "section": "Reading", "topic": "Make someone happy", "prompt": "What helped the new student feel more confident?", "correct": "Arun’s kind words", "distractors": ["A gift from a teacher", "A change of classroom", "A canceled presentation"], "explanation": "ประโยคสุดท้ายบอกว่า the kind words had helped her feel more confident", "passageId": "reading-4"}, {"id": 49, "unit": 5, "section": "Reading", "topic": "A weekend in Medellín", "prompt": "What was the guide’s advice about the square?", "correct": "Visit it early.", "distractors": ["Avoid it all weekend.", "Buy food there at night.", "Visit it after the biggest crowds arrive."], "explanation": "advised her to visit the square early คือแนะนำให้ไปจัตุรัสแต่เช้า", "passageId": "reading-5"}, {"id": 50, "unit": 5, "section": "Reading", "topic": "A weekend in Medellín", "prompt": "How did Ana buy her discounted ticket?", "correct": "Online", "distractors": ["From the guide", "At the main square", "On the train"], "explanation": "ประโยคท้ายระบุ bought a discounted ticket online", "passageId": "reading-5"}], "passages": {"listening-1": {"title": "City news", "text": "Here is this morning’s local news. The old train station reopened on Friday. A group of students filmed the opening and sent their video to the local news website."}, "listening-2": {"title": "Study routine", "text": "I set aside fifteen minutes after dinner to make flash cards. I used to write only translations, but now I also write a short example for each new word."}, "listening-3": {"title": "Cooking class", "text": "Today we’re making dumplings. Put them in a basket above boiling water, and steam them for eight minutes. Once they are cooked, serve them with a spicy sauce."}, "listening-4": {"title": "On the bus", "text": "The bus was full this morning. When an older passenger got on, Maya offered him her seat. He thanked her and said he had been standing for nearly twenty minutes."}, "listening-5": {"title": "Hotel check-in", "text": "Good evening. Your room has been upgraded to a larger one at no extra cost. Breakfast is served from seven, and you can get a discounted ticket to the museum here at the front desk."}, "reading-1": {"title": "Citizen journalism", "text": "When a storm blocked a road in Linton, a resident filmed the fallen tree and sent the video to a local news site. Before publishing it, an editor checked when and where the video was taken. The site updated its report after the road reopened."}, "reading-2": {"title": "Too much information", "text": "Nina follows many accounts and spends too much time reading updates. She now sets aside twenty minutes in the evening to check messages. Email is her primary channel for important updates, so she checks it first."}, "reading-3": {"title": "Future food", "text": "At a future-food fair, visitors can try a vegetable burger and a burger made with lab-grown beef. One stall sells crackers made with cricket flour. The fair also displays beehives. The guide points to them and says, “Every rooftop garden in our project has one now.”"}, "reading-4": {"title": "Make someone happy", "text": "A new student arrived in class on Monday. Arun invited her to sit with his group. When he noticed she was nervous about her presentation, he said he liked her idea. Later she told him that the kind words had helped her feel more confident."}, "reading-5": {"title": "A weekend in Medellín", "text": "On a weekend trip to Medellín, Ana found the main square lively but crowded. Her guide advised her to visit the square early and take the metro to her next stop. Ana bought a discounted ticket online and arrived before the biggest crowds."}}, "audio": {"listening-1": "AAAAHGZ0eXBNNEEgAAACAE00QSBpc29taXNvMgAABW5tb292AAAAbG12aGQAAAAA5yjAyucowMoAAAPoAAAmzAABAAABAAAAAAAAAAAAAAAAAQAAAAAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAACAAAEmXRyYWsAAABcdGtoZAAAAAPnKMDK5yjAygAAAAEAAAAAAAAmzAAAAAAAAAAAAAAAAQEAAAAAAQAAAAAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAACRlZHRzAAAAHGVsc3QAAAAAAAAAAQAAJswAAAQAAAEAAAAABBFtZGlhAAAAIG1kaGQAAAAA5yjAyucowMoAAD6AAAJwsVXEAAAAAAAtaGRscgAAAAAAAAAAc291bgAAAAAAAAAAAAAAAFNvdW5kSGFuZGxlcgAAAAO8bWluZgAAABBzbWhkAAAAAAAAAAAAAAAkZGluZgAAABxkcmVmAAAAAAAAAAEAAAAMdXJsIAAAAAEAAAOAc3RibAAAAGpzdHNkAAAAAAAAAAEAAABabXA0YQAAAAAAAAABAAAAAAAAAAAAAQAQAAAAAD6AAAAAAAA2ZXNkcwAAAAADgICAJQABAASAgIAXQBUAAAAAAF6PAABejwWAgIAFFAhW5QAGgICAAQIAAAAgc3R0cwAAAAAAAAACAAAAnAAABAAAAAABAAAAsQAAABxzdHNjAAAAAAAAAAEAAAABAAAAnQAAAAEAAAKIc3RzegAAAAAAAAAAAAAAnQAAASEAAAECAAAApgAAANAAAAC+AAAAzgAAAMoAAAC1AAAAlgAAAKMAAAD2AAAAtQAAAN4AAACuAAAAywAAAKIAAADdAAAAtgAAAM8AAADCAAAAxAAAAPoAAACjAAAAqQAAALYAAADDAAAAtgAAAOMAAACfAAAAzgAAALYAAADDAAAA4wAAANYAAADOAAAA0wAAAKwAAACcAAAAxAAAAMkAAAC6AAAArQAAAOEAAADmAAAAlwAAALIAAACxAAAAqAAAAMIAAAC6AAAA9wAAAJ0AAACxAAAAqAAAAMcAAADUAAAAvAAAANUAAAC5AAAAxgAAALgAAADiAAAArAAAAL8AAADlAAAArQAAALAAAACgAAAAwAAAAMAAAAC6AAAA1gAAAKwAAADRAAAA3QAAAM8AAAC7AAAAvgAAANkAAADJAAAA1AAAAMIAAADEAAAApQAAAKoAAACsAAAA7gAAAKEAAACVAAAArwAAAQ0AAADzAAAAkgAAAKEAAACkA <script>
'use strict';

const { units, words, definitions, grammar, questions, passages, audio } =
  JSON.parse(document.querySelector('#material').textContent);
const sections = ['Listening', 'Grammar', 'Vocabulary', 'Reading'];
const labels = { full: 'ข้อสอบจำลอง', focus: 'ฝึก Grammar + Vocabulary', retry: 'ฝึกซ้ำข้อที่พลาด' };
const app = document.querySelector('#app');
const announcement = document.querySelector('#announcement');
const storageKey = 'en103-003-mock-v1';
const starredStorageKey = 'en103-003-starred-words-v1';
const bank = new Map(questions.map(question => [question.id, question]));
const letters = 'ABCD';
const unitName = unit => 'Unit ' + unit + ' · ' + units[unit - 1];

let view = 'home';
let attempt = loadAttempt();
let onlyMissed = false;
let cardUnit = 0;
let cardSearch = '';
let cardIndex = 0;
let cardFlipped = false;
let shuffledCards = words;
let grammarUnit = 0;
let matchUnit = 0;
let matching = null;
const starredWords = loadStarredWords();
let matchDrag = null;
let matchDragClickUntil = 0;
let activeAudio = null;
let activeAudioId = null;

function escapeHtml(value) {
  const entities = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  return String(value).replace(/[&<>"']/g, character => entities[character]);
}

function loadAttempt() {
  try {
    const saved = JSON.parse(localStorage.getItem(storageKey));
    return saved && saved.mode in labels && saved.items.length &&
      saved.items.every(item => bank.has(item.id) && item.options.length === 4)
      ? saved : null;
  } catch {
    return null;
  }
}

function saveAttempt() {
  try {
    localStorage.setItem(storageKey, JSON.stringify(attempt));
  } catch {
    // Work within the open tab if storage is unavailable.
  }
}

function shuffle(items) {
  const copy = [...items];
  for (let index = copy.length - 1; index > 0; index--) {
    const randomIndex = Math.floor(Math.random() * (index + 1));
    [copy[index], copy[randomIndex]] = [copy[randomIndex], copy[index]];
  }
  return copy;
}

function begin(mode) {
  if (mode !== 'retry' && attempt && !attempt.submitted &&
      attempt.items.some(item => item.response !== null) &&
      !confirm('เริ่มชุดใหม่และล้างคำตอบของชุดที่กำลังทำอยู่ใช่ไหม?')) return;
  const selected = mode === 'retry'
    ? attempt.items.filter(item => !isRight(item)).map(item => bank.get(item.id))
    : questions.filter(question => mode === 'full' || ['Grammar', 'Vocabulary'].includes(question.section));
  if (!selected.length) return;
  attempt = {
    mode,
    index: 0,
    deadline: mode === 'full' ? Date.now() + 50 * 60 * 1000 : null,
    submitted: false,
    timedOut: false,
    items: selected.map(question => ({
      id: question.id,
      options: shuffle([question.correct, ...question.distractors]),
      response: null
    }))
  };
  saveAttempt();
  openView('exam');
}

function loadStarredWords() {
  try {
    const saved = JSON.parse(localStorage.getItem(starredStorageKey));
    return new Set(words.filter(([, , word]) => Array.isArray(saved) && saved.includes(word)).map(([, , word]) => word));
  } catch {
    return new Set();
  }
}

function startMatching(review = false) {
  const pool = shuffle(words.filter(([unit, , word]) =>
    review ? starredWords.has(word) : matchUnit === 0 || unit === matchUnit));
  if (!pool.length) return;
  const roundCount = Math.ceil(pool.length / 6);
  const rounds = Array.from({ length: roundCount }, (_, index) => {
    const start = Math.floor(index * pool.length / roundCount);
    const end = Math.floor((index + 1) * pool.length / roundCount);
    return pool.slice(start, end);
  });
  matching = { rounds, index: -1, total: pool.length, matchedTotal: 0, mistakeTotal: 0, skippedTotal: 0, review };
  nextMatchRound();
}

function nextMatchRound() {
  matching.index++;
  matching.words = matching.rounds[matching.index];
  const usedWords = new Set(matching.words.map(([, , word]) => word));
  const usedUnits = new Set(matching.words.map(([unit]) => unit));
  const distractors = matching.review && matching.words.length < 4
    ? shuffle(words.filter(([unit, , word]) => usedUnits.has(unit) && !usedWords.has(word)))
      .slice(0, 4 - matching.words.length)
    : [];
  matching.meanings = [...matching.words, ...distractors];
  matching.meaningOrder = shuffle(matching.meanings.map((_, index) => index));
  matching.matched = new Set();
  matching.skipped = new Set();
  matching.selected = null;
  matching.incorrect = null;
  matching.feedback = '';
  matching.feedbackClass = '';
}

function renderMatching() {
  if (!matching) startMatching();
  app.innerHTML = `
    <section class="study match-study">
      <header class="page-title"><div class="eyebrow">VOCABULARY · B1</div><h1 tabindex="-1">จับคู่คำศัพท์</h1>

  renderMatchBoard('round');
}

function renderMatchBoard(motion = '') {
  clearMatchDrag();
  const { rounds, index, total, matchedTotal, words: currentWords, meaningOrder, matched,
    meanings, skipped, skippedTotal, selected, incorrect, feedback, feedbackClass, mistakeTotal, review } = matching;
  const complete = matched.size + skipped.size === currentWords.length;
  const card = (wordIndex, isMeaning) => {
    const isMatched = matched.has(wordIndex);
    const isSkipped = skipped.has(wordIndex);
    const isWrong = isMeaning && incorrect === wordIndex;
    const active = !isMeaning && selected === wordIndex;
    const word = (isMeaning ? meanings : currentWords)[wordIndex][2];
    const label = isMeaning ? definitions[word] : word;
    const state = isMatched ? ' matched' : isSkipped ? ' skipped' : isWrong ? ' incorrect' : '';
    const tile = `<button type="button" class="button match-tile${state}"
      data-${isMeaning ? 'match-meaning' : 'match-word'}="${wordIndex}"
      ${isMeaning ? '' : `aria-pressed="${active}"`}
      ${isMatched || isSkipped || complete ? 'disabled' : ''}>
      ${isMatched && !isMeaning ? '<span>✓ จับคู่แล้ว</span>' : `<span lang="en">${escapeHtml(label)}</span>`}
      ${isMatched && isMeaning ? `<span class="placed-word" lang="en">✓ ${escapeHtml(word)}</span>` : ''}
    </button>`;
    if (isMeaning) return tile;
    const starred = starredWords.has(word);
    return `<div class="match-word-row">
      ${tile}
      <button type="button" class="button star-word" data-match-star="${wordIndex}" aria-pressed="${starred}"
        aria-label="ติดดาว ${escapeHtml(word)}" title="${starred ? 'เอาดาวออก' : 'เก็บคำนี้ไว้ฝึก'}">${starred ? '★' : '☆'}</button>
    </div>`;
  };
  const last = index === rounds.length - 1;
  const canSkip = currentWords.some(([, , word], wordIndex) =>
    starredWords.has(word) && !matched.has(wordIndex) && !skipped.has(wordIndex));
  const board = document.querySelector('#matching-board');
  board.innerHTML = `
    <div class="split"><span class="muted">${review ? 'ทบทวนคำที่ติดดาว · ' : ''}รอบ ${index + 1} / ${rounds.length}</span>
      <span class="match-count">จับคู่แล้ว ${matchedTotal} / ${total} คำ${skippedTotal ? ' · ข้าม ' + skippedTotal + ' คำ' : ''}</span></div>
    <progress class="progress" aria-label="จำนวนคำที่จับคู่หรือข้ามแล้ว" max="${total}" value="${matchedTotal + skippedTotal}"></progress>
    <p class="match-feedback ${feedbackClass}${motion === 'answer' ? ' match-enter' : ''}">${escapeHtml(feedback || 'ลากการ์ด หรือแตะคำศัพท์แล้วแตะความหมาย')}</p>
    <div class="match-grid${motion === 'round' ? ' match-enter' : ''}">
      <section class="match-column match-words" aria-labelledby="match-english"><h2 id="match-english">คำศัพท์อังกฤษ</h2>
        ${currentWords.map((_, wordIndex) => card(wordIndex, false)).join('')}</section>
      <section class="match-column match-options" aria-labelledby="match-definition">
        <h2 id="match-definition">ความหมายภาษาอังกฤษ</h2>
        ${meaningOrder.map(wordIndex => card(wordIndex, true)).join('')}
      </section>
    </div>
    <div class="actions match-actions">
      ${complete && !last ? '<button class="button primary" data-action="match-next">รอบถัดไป</button>' : ''}
      <button class="button ${complete && last ? 'primary' : 'soft'}" data-action="match-review" ${starredWords.size ? '' : 'disabled'}>ฝึกคำที่ติดดาว (${starredWords.size})</button>
      ${canSkip ? '<button class="button" data-action="match-skip">ข้ามคำที่ติดดาวในรอบนี้</button>' : ''}
      <button class="button" data-action="match-reset">${review ? 'กลับไปฝึกตามบท' : complete && last ? 'เริ่มใหม่' : 'สลับคำแล้วเริ่มใหม่'}</button>
      ${complete && last ? `<span class="match-count">${skippedTotal ? 'จบชุดฝึก' : 'ครบทุกคำ'} · จับคู่ผิด ${mistakeTotal} ครั้ง</span>` : ''}
    </div>`;
}

function clearMatchDrag() {
  matchDrag?.preview?.remove();
  matchDrag?.source.classList.remove('drag-source');
  matchDrag?.target?.classList.remove('drop-ready');
  matchDrag = null;
}

function matchDropTarget(x, y) {
  const target = document.elementFromPoint(x, y)?.closest('[data-match-meaning]');
  return target && !target.disabled ? target : null;
}

function updateDraggedCard(drag) {
  const x = Math.max(8, Math.min(window.innerWidth - drag.preview.offsetWidth - 8, drag.x - drag.grabX));
  const y = Math.max(8, Math.min(window.innerHeight - drag.preview.offsetHeight - 8, drag.y - drag.grabY));
  drag.preview.style.transform = `translate3d(${x}px,${y}px,0)`;
  const target = matchDropTarget(drag.x, drag.y);
  if (target === drag.target) return;
  drag.target?.classList.remove('drop-ready');
  drag.target = target;
  target?.classList.add('drop-ready');
}

function beginMatchDrag(event) {
  if (view !== 'match' || !event.isPrimary || event.button !== 0) return;
  matchDragClickUntil = 0;
  const word = event.target.closest('[data-match-word]');
  if (!word || word.disabled) return;
  clearMatchDrag();
  matchDrag = {
    pointerId: event.pointerId, index: Number(word.dataset.matchWord),
    startX: event.clientX, startY: event.clientY, touch: event.pointerType === 'touch',
    source: word, target: null, preview: null
  };
}

function moveMatchDrag(event) {
  if (matchDrag?.pointerId !== event.pointerId) return;
  const drag = matchDrag;
  const firstMove = !drag.preview;
  if (firstMove && Math.hypot(event.clientX - drag.startX, event.clientY - drag.startY) < 7) return;
  drag.x = event.clientX;
  drag.y = event.clientY;
  if (event.cancelable) event.preventDefault();
  if (firstMove) {
    const rect = drag.source.getBoundingClientRect();
    const preview = document.createElement('div');
    preview.className = 'drag-card-preview';
    preview.lang = 'en';
    preview.setAttribute('aria-hidden', 'true');
    preview.textContent = matching.words[drag.index][2];
    preview.style.width = `${rect.width}px`;
    document.body.append(preview);
    drag.preview = preview;
    drag.grabX = drag.touch ? preview.offsetWidth / 2 : drag.startX - rect.left;
    drag.grabY = drag.touch ? preview.offsetHeight + 14 : drag.startY - rect.top;
    drag.source.classList.add('drag-source');
    drag.source.setPointerCapture?.(event.pointerId);
    function scrollWhileDragging() {
      if (matchDrag !== drag) return;
      const distance = Math.max(0, drag.y - window.innerHeight + 50) - Math.max(0, 50 - drag.y);
      if (distance) {
        window.scrollBy(0, Math.max(-8, Math.min(8, distance / 6)));
        updateDraggedCard(drag);
      }
      window.requestAnimationFrame(scrollWhileDragging);
    }
    window.requestAnimationFrame?.(scrollWhileDragging);
  }
  updateDraggedCard(drag);
}

function endMatchDrag(event) {
  if (matchDrag?.pointerId !== event.pointerId) return;
  const { preview, index } = matchDrag;
  clearMatchDrag();
  if (!preview) return;
  matchDragClickUntil = Date.now() + 400;
  if (event.type === 'pointerup') {
    const target = matchDropTarget(event.clientX, event.clientY);
    if (target) {
      matching.selected = index;
      selectMatchMeaning(Number(target.dataset.matchMeaning));
    }
  }
}

function toggleMatchStar(index) {
  const word = matching.words[index][2];
  const wasStarred = starredWords.delete(word);
  if (!wasStarred) starredWords.add(word);
  try {
    localStorage.setItem(starredStorageKey, JSON.stringify([...starredWords]));
  } catch {
    // Keep the list in the current tab when browser storage is unavailable.
  }
  renderMatchBoard();
  document.querySelector(`[data-match-star="${index}"]`).focus({ preventScroll: true });
  announcement.textContent = wasStarred ? 'เอาดาวออกจาก ' + word : 'เก็บ ' + word + ' ไว้ฝึกแล้ว';
}

function focusNextMatch() {
  const nextWord = matching.words.findIndex((_, index) => !matching.matched.has(index) && !matching.skipped.has(index));
  const focus = nextWord >= 0 ? `[data-match-word="${nextWord}"]`
    : matching.index < matching.rounds.length - 1 ? '[data-action="match-next"]'
    : starredWords.size ? '[data-action="match-review"]' : '[data-action="match-reset"]';
  document.querySelector(focus).focus();
}

function skipStarredWords() {
  matching.words.forEach(([, , word], index) => {
    if (starredWords.has(word) && !matching.matched.has(index) && !matching.skipped.has(index)) {
      matching.skipped.add(index);
      matching.skippedTotal++;
    }
  });
  matching.selected = null;
  matching.incorrect = null;
  matching.feedback = 'ข้ามคำที่ติดดาวแล้ว คำเหล่านี้อยู่ในชุดทบทวน';
  matching.feedbackClass = '';
  renderMatchBoard();
  focusNextMatch();
  announcement.textContent = matching.feedback;
}

function selectMatchWord(index) {
  matching.selected = matching.selected === index ? null : index;
  matching.incorrect = null;
  matching.feedback = '';
  matching.feedbackClass = '';
  renderMatchBoard();
  if (matching.selected === null) {
    document.querySelector(`[data-match-word="${index}"]`).focus();
  } else {
    const firstOption = matching.meaningOrder.find(meaning => !matching.matched.has(meaning) && !matching.skipped.has(meaning));
    document.querySelector(`[data-match-meaning="${firstOption}"]`).focus();
  }
  announcement.textContent = matching.selected === null
    ? 'เลือกคำศัพท์อีกคำได้'
    : 'เลือกความหมายของ ' + matching.words[index][2];
}

function selectMatchMeaning(index) {
  const { selected, words: currentWords, matched } = matching;
  if (selected === null) {
    matching.feedback = 'เลือกคำศัพท์อังกฤษก่อน แล้วค่อยเลือกความหมาย';
    matching.feedbackClass = '';
  } else if (selected === index) {
    matched.add(index);
    matching.matchedTotal++;
    matching.selected = null;
    matching.incorrect = null;
    matching.feedback = `ถูกต้อง! ${currentWords[index][2]} = ${definitions[currentWords[index][2]]}`;
    matching.feedbackClass = 'good';
  } else {
    matching.mistakeTotal++;
    matching.incorrect = index;
    matching.feedback = `ยังไม่ตรงกับ ${currentWords[selected][2]} ลองเลือกความหมายอื่น`;
    matching.feedbackClass = 'wrong';
  }
  renderMatchBoard('answer');
  if (matched.has(index)) {
    focusNextMatch();
  } else {
    document.querySelector(`[data-match-meaning="${index}"]`).focus({ preventScroll: true });
  }
  announcement.textContent = matching.feedback;
}

        ${context}
        <h2 class="qtitle" id="question-title" tabindex="-1">${question.prompt}</h2>
        <fieldset class="choices"><legend class="sr-only">เลือกคำตอบหนึ่งข้อ</legend>
        ${current.options.map((option, index) => `
          <label class="choice">
            <input type="radio" name="answer" value="${index}" ${current.response === option ? 'checked' : ''}>
            <span class="letter" aria-hidden="true">${letters[index]}</span><span>${option}</span>
          </label>`).join('')}
        </fieldset>
        <div class="split">
          <button class="button" data-action="previous" ${attempt.index === 0 ? 'disabled' : ''}>ข้อก่อนหน้า</button>
          ${attempt.index === attempt.items.length - 1
            ? '<button class="button primary" data-action="submit">ส่งคำตอบ</button>'
            : '<button class="button primary" data-action="next">ข้อถัดไป</button>'}
        </div>
      </section>
      <aside class="card jump" aria-label="เลือกข้อ"><h2>แผ่นคำตอบ</h2><div id="jump-list"></div>
        <button class="submit" data-action="submit">ส่งคำตอบ</button>
      </aside>
    </div>`;
  if (question.section === 'Listening') placeAudio(question.passageId);
  else releaseAudio();
  renderProgress();
  updateTimer();
}

function answeredCount() {
  return attempt.items.filter(item => item.response !== null).length;
}

function renderProgress() {
  const count = answeredCount();
  document.querySelector('#progress').value = count;
  document.querySelector('#answered').textContent = `ตอบแล้ว ${count} จาก ${attempt.items.length} ข้อ`;
  const buttons = sections.map(section => {
    const entries = attempt.items.map((item, index) => ({ item, index }))
      .filter(({ item }) => bank.get(item.id).section === section);
    if (!entries.length) return '';
    return `<section><small lang="en">${section}</small><div>${entries.map(({ item, index }) => {
      const done = item.response !== null;
      return `<button data-jump="${index}" class="${done ? 'done' : ''}" ${attempt.index === index ? 'aria-current="step"' : ''} aria-label="ข้อ ${index + 1} ${done ? 'ตอบแล้ว' : 'ยังไม่ตอบ'}">${index + 1}</button>`;
    }).join('')}</div></section>`;
  });
  document.querySelector('#jump-list').innerHTML = buttons.join('');
}

function goTo(index) {
  if (!Number.isInteger(index) || index < 0 || index >= attempt.items.length) return;
  attempt.index = index;
  saveAttempt();
  renderExam();
  window.scrollTo(0, 0);
  focusHeading();
}

function updateTimer() {
  if (!attempt?.deadline || attempt.submitted) return;
  const left = Math.max(0, Math.ceil((attempt.deadline - Date.now()) / 1000));
  if (left === 0) {
    finish(true, false);
    return;
  }
  const timer = document.querySelector('#timer');
  if (!timer) return;
  const time = [Math.floor(left / 60), left % 60].map(value => String(value).padStart(2, '0')).join(':');
  timer.textContent = time;
  timer.classList.toggle('urgent', left <= 300);
}

function finish(timedOut, confirmSubmit) {
  if (!attempt || attempt.submitted) return;
  const remaining = attempt.items.length - answeredCount();
  if (confirmSubmit) {
    const message = remaining ? `ยังไม่ได้ตอบ ${remaining} ข้อ ส่งคำตอบเลยไหม?` : 'ส่งคำตอบเพื่อดูคะแนนและเฉลยใช่ไหม?';
    if (!confirm(message)) return;
  }
  attempt.timedOut = timedOut || Boolean(attempt.deadline && Date.now() >= attempt.deadline);
  attempt.submitted = true;
  onlyMissed = false;
  saveAttempt();
  if (view === 'exam') openView('results');
  else render();
}

function isRight(item) {
  return item.response === bank.get(item.id).correct;
}

function renderResults() {
  const score = attempt.items.filter(isRight).length;
  const missed = attempt.items.length - score;
  const scoreCards = sections.map(section => {
    const items = attempt.items.filter(item => bank.get(item.id).section === section);
    return items.length ? `<div><span lang="en">${section}</span><b>${items.filter(isRight).length} / ${items.length}</b></div>` : '';
  }).join('');
  app.innerHTML = `
    <header class="page-title"><div class="eyebrow">RESULTS</div><h1 tabindex="-1">ผล${labels[attempt.mode]}</h1>
      <p>${attempt.timedOut ? 'หมดเวลา ระบบส่งคำตอบให้แล้ว' : 'เปิดแต่ละข้อเพื่อดูคำอธิบาย'}</p>
    </header>
    <section class="card result-summary" aria-label="สรุปคะแนน">
      <div class="score">${score} / ${attempt.items.length}</div>
      <p>ตอบถูก ${Math.round(score * 100 / attempt.items.length)}% · เว้นคำตอบ ${attempt.items.length - answeredCount()} ข้อ</p>
      <div class="score-grid">${scoreCards}</div>
      <div class="actions">
        ${missed ? '<button class="button primary" data-action="retry">ฝึกซ้ำข้อที่พลาด</button>' : ''}
        <button class="button" data-action="home">กลับหน้าหลัก</button>
      </div>
    </section>
    <div class="split result-bar"><h2>เฉลย</h2>
      <button id="review-filter" class="button soft" data-action="missed" aria-pressed="false">เฉพาะข้อที่พลาด</button>
    </div>
    <div class="review" id="review"></div>`;
  renderReview();
}

function renderReview() {
  document.querySelector('#review-filter').setAttribute('aria-pressed', String(onlyMissed));
  const entries = attempt.items.map((item, index) => {
    const correct = isRight(item);
    if (onlyMissed && correct) return '';
    const status = correct ? 'ถูก' : item.response === null ? 'เว้นคำตอบ' : 'ผิด';
    const question = bank.get(item.id);
    const passage = passages[question.passageId];
    return `<details>
      <summary><span class="${correct ? 'correct' : 'miss'}">ข้อ ${index + 1} · ${status}</span> · ${question.prompt}
      <small>${question.section} · Unit ${question.unit} · ${question.topic}</small></summary>
      <p>คำตอบของคุณ <strong>${item.response ?? '—'}</strong></p>
      <p>คำตอบที่ถูก <strong>${question.correct}</strong></p>
      <p>${question.explanation}</p>
      ${passage ? `<blockquote><strong>${question.section === 'Listening' ? 'บทถอดเสียง' : 'บทอ่าน'}</strong><p lang="en">${passage.text}</p></blockquote>` : ''}
    </details>`;
  }).join('');
  document.querySelector('#review').innerHTML = entries || '<p class="card empty">ไม่มีข้อที่พลาด</p>';
}

document.addEventListener('pointerdown', beginMatchDrag);
document.addEventListener('pointermove', moveMatchDrag, { passive: false });
document.addEventListener('pointerup', endMatchDrag);
document.addEventListener('pointercancel', endMatchDrag);
window.addEventListener?.('blur', clearMatchDrag);

document.addEventListener('click', event => {
  const button = event.target.closest('button');
  if (!button) return;
  if (event.detail > 0 && Date.now() < matchDragClickUntil &&
      (button.dataset.matchWord !== undefined || button.dataset.matchMeaning !== undefined)) return;
  if (button.dataset.view) openView(button.dataset.view);
  if (button.dataset.jump !== undefined) goTo(Number(button.dataset.jump));
  if (button.dataset.matchWord !== undefined) selectMatchWord(Number(button.dataset.matchWord));
  if (button.dataset.matchMeaning !== undefined) selectMatchMeaning(Number(button.dataset.matchMeaning));
  if (button.dataset.matchStar !== undefined) toggleMatchStar(Number(button.dataset.matchStar));
  const action = button.dataset.action;
  if (action === 'match-skip') skipStarredWords();
  if (['match-reset', 'match-next', 'match-review'].includes(action)) {
    if (action === 'match-next') nextMatchRound();
    else startMatching(action === 'match-review');
    renderMatchBoard('round');
    document.querySelector('[data-match-word="0"]').focus();
    announcement.textContent = `รอบ ${matching.index + 1} จาก ${matching.rounds.length}`;
  }
  if (['full', 'focus', 'retry'].includes(action)) begin(action);
  if (action === 'home') openView('home');
  if (action === 'resume') openView(attempt.submitted ? 'results' : 'exam');
  if (action === 'next') goTo(attempt.index + 1);
  if (action === 'previous') goTo(attempt.index - 1);
  if (action === 'submit') finish(false, true);
  if (action === 'missed') {
    onlyMissed = !onlyMissed;
    renderReview();
  }
  if (['flip', 'shuffle', 'card-next', 'card-back'].includes(action)) {
    if (action === 'shuffle') {
      shuffledCards = shuffle(shuffledCards);
      cardIndex = 0;
    }
    if (action === 'card-next') cardIndex++;
    if (action === 'card-back') cardIndex--;
    cardFlipped = action === 'flip' && !cardFlipped;
    renderFlash();
    document.querySelector(`[data-action="${action}"]`)?.focus({ preventScroll: true });
  }
});

app.addEventListener('change', event => {
  const input = event.target;
  if (input.name === 'answer') {
    const item = attempt.items[attempt.index];
    item.response = item.options[Number(input.value)];
    saveAttempt();
    renderProgress();
    announcement.textContent = document.querySelector('#answered').textContent;
  }
  if (input.id === 'card-unit') {
    cardUnit = Number(input.value);
    cardIndex = 0;
    cardFlipped = false;
    renderFlash();
  }
  if (input.id === 'grammar-unit') {
    grammarUnit = Number(input.value);
    renderGrammar();
    document.querySelector('#grammar-unit').focus();
  }
  if (input.id === 'match-unit') {
    matchUnit = Number(input.value);
    startMatching();
    renderMatchBoard('round');
    announcement.textContent = `เริ่มฝึกจับคู่ ${matching.total} คำ`;
  }
});

app.addEventListener('input', event => {
  if (event.target.id !== 'card-search') return;
  cardSearch = event.target.value;
  cardIndex = 0;
  cardFlipped = false;
  renderFlash();
});

updateTimer();
render();
window.setInterval(updateTimer, 250);
document.addEventListener('visibilitychange', updateTimer);

</script>
</body>
</html>
